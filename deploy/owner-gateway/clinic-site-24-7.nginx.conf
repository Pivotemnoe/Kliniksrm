limit_conn_zone $binary_remote_addr zone=clinic_site_connections:10m;
limit_req_zone $server_name zone=clinic_site_total:1m rate=100r/s;
limit_req_zone $binary_remote_addr zone=clinic_site_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=clinic_site_inquiries:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=clinic_site_analytics:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name clinic.temichevvet.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clinic.temichevvet.ru;
    root /var/www/temichevvet-clinic/current;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn clinic_site_connections 30;
    limit_req zone=clinic_site_total burst=200 nodelay;
    limit_req zone=clinic_site_general burst=60 nodelay;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/clinic.temichevvet.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.temichevvet.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Jnu/TBQChJKfqDFNyXV+32yz8a32SLTz8QVf7SEydCc='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    expires -1;
    location = /v1/public/clinic/catalog {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        expires off;
    }
    location = /v1/public/clinic/analytics/events {
        limit_req zone=clinic_site_total burst=200 nodelay;
        limit_req zone=clinic_site_general burst=60 nodelay;
        limit_req zone=clinic_site_analytics burst=20 nodelay;
        limit_except POST OPTIONS { deny all; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location = /v1/public/clinic/inquiries {
        limit_req zone=clinic_site_total burst=200 nodelay;
        limit_req zone=clinic_site_general burst=60 nodelay;
        limit_req zone=clinic_site_inquiries burst=5 nodelay;
        limit_except POST OPTIONS { deny all; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location ^~ /photo-plan { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /api/ { return 404; }
    location ~ /\. { deny all; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location /fonts/ { try_files $uri =404; expires 30d; }
    location /images/ { try_files $uri =404; expires 1d; }
    location = /inpatient { return 301 /services/inpatient; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { try_files $uri/index.html $uri =404; }
}
