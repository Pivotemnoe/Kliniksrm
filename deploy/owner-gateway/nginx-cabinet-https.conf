limit_conn_zone $binary_remote_addr zone=owner_gateway_connections:10m;
limit_req_zone $server_name zone=owner_gateway_total:1m rate=100r/s;
limit_req_zone $binary_remote_addr zone=owner_gateway_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=owner_gateway_sensitive:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=owner_gateway_sync:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name cabinet.temichevvet.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cabinet.temichevvet.ru;

    ssl_certificate /etc/letsencrypt/live/cabinet.temichevvet.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cabinet.temichevvet.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn owner_gateway_connections 30;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /v1/portal/sessions {
        limit_req zone=owner_gateway_total burst=200 nodelay;
        limit_req zone=owner_gateway_sensitive burst=6 nodelay;
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }

    # Only the owner-gateway host/container network can use the existing NL bridge.
    # The upstream also requires its bearer token; no OpenAI key is stored here.
    location = /internal/openai/v1/chat/completions {
        allow 127.0.0.1;
        allow 193.188.23.65;
        allow 172.21.0.0/16;
        deny all;
        if ($request_method != POST) { return 405; }
        limit_req zone=owner_gateway_total burst=200 nodelay;
        limit_req zone=owner_gateway_sensitive burst=6 nodelay;
        client_max_body_size 24k;
        proxy_pass http://127.0.0.1:8091/v1/chat/completions;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_hide_header X-Powered-By;
    }

    location ^~ /internal/ {
        client_max_body_size 24m;
        limit_req zone=owner_gateway_total burst=200 nodelay;
        limit_req zone=owner_gateway_sync burst=30 nodelay;
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }

    location = /v1/webhooks/max {
        limit_req zone=owner_gateway_total burst=200 nodelay;
        limit_req zone=owner_gateway_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:4100;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
    }

    location / {
        limit_req zone=owner_gateway_total burst=200 nodelay;
        limit_req zone=owner_gateway_general burst=30 nodelay;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }
}
