limit_req_zone $binary_remote_addr zone=crm_requests:10m rate=100r/s;
map $request_method $crm_form_client {
  default $binary_remote_addr;
  GET "";
  HEAD "";
  OPTIONS "";
}
limit_req_zone $crm_form_client zone=crm_forms:10m rate=30r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;
  client_body_timeout 15s;
  limit_req_status 429;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /api/v1/live-updates {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=crm_requests burst=300 nodelay;
    limit_req zone=crm_forms burst=120 nodelay;
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    # Большие проверяемые переносы выполняются последовательно и могут занять
    # несколько минут. Соединение держим открытым, чтобы интерфейс получил
    # итог партии, а не ложную ошибку тайм-аута.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
