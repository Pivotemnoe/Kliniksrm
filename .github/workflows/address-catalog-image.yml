name: Publish address catalog updater
on:
  push:
    branches: [main]
    paths: ['scripts/address-catalog/**', 'certs/russian_trusted_root_ca.pem', '.github/workflows/address-catalog-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/address-catalog/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/pivotemnoe/kliniksrm-address-updater:stable
            ghcr.io/pivotemnoe/kliniksrm-address-updater:${{ github.sha }}
