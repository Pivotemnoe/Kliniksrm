name: Publish verified CRM redesign Web

on:
  push:
    branches: [codex/crm-redesign-production-20261019]
    paths: [.github/workflows/publish-crm-redesign-web.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: crm-redesign-web-20261019-r3
  cancel-in-progress: false

jobs:
  publish-verified-web:
    runs-on: ubuntu-latest
    env:
      ARCHIVE_URL: ${{ secrets.CRM_REDESIGN_IMAGE_DOWNLOAD_URL }}
      WEB_IMAGE: ghcr.io/pivotemnoe/kliniksrm-web:bdc570cb24a7acdc5c8f0648112daf2d008e7300
    steps:
      - name: Match the qualified OCI image store
        uses: docker/setup-docker-action@v5
        with:
          version: v29.6.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Download the locally qualified image
        run: curl --fail --location --retry 2 --silent --show-error "$ARCHIVE_URL" --output web-image.tar.gz
      - name: Verify archive and exact image identity
        shell: bash
        run: |
          echo '61fdcc73dce478a448b6196dcfd0882542083a169cf77ef0c307398a642f21e3  web-image.tar.gz' | sha256sum --check --strict
          docker load --input web-image.tar.gz
          test "$(docker image inspect "$WEB_IMAGE" --format '{{.Id}}')" = 'sha256:327685856a7dfbbded61057cddfd17d963cedc399f26aedc620bbb85134f6e8d'
          test "$(docker image inspect "$WEB_IMAGE" --format '{{.Architecture}}')" = 'amd64'
          test "$(docker image inspect "$WEB_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = 'bdc570cb24a7acdc5c8f0648112daf2d008e7300'
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the qualified staff interface
        run: docker push "$WEB_IMAGE"
