name: Publish verified invoice Web

on:
  push:
    branches: [codex/crm-large-invoice-performance-20261019]
    paths: [.github/workflows/publish-crm-invoice-web.yml]

permissions:
  contents: read
  packages: write

concurrency:
  group: crm-invoice-web-20261019-r1
  cancel-in-progress: false

jobs:
  publish-verified-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARCHIVE_URL: ${{ secrets.CRM_INVOICE_IMAGE_DOWNLOAD_URL }}
      WEB_IMAGE: ghcr.io/pivotemnoe/kliniksrm-web:86962b5018701f2fef3482fae7b3edda9039b9a8
    steps:
      - name: Use the qualified OCI image store
        uses: docker/setup-docker-action@v5
        with:
          version: v29.6.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Download the qualified image archive
        run: curl --fail --location --retry 2 --silent --show-error "$ARCHIVE_URL" --output web-images.tar.gz
      - name: Verify the exact accepted Web image
        shell: bash
        run: |
          echo 'f06821e2b38eec5dcba258b8fe896d5ea154608046887aa3982f7e4a4fb3de6f  web-images.tar.gz' | sha256sum --check --strict
          docker load --input web-images.tar.gz
          test "$(docker image inspect "$WEB_IMAGE" --format '{{.Id}}')" = 'sha256:fe0cbe0e5a9d08bae729d7e5068b2d71234d99e62316dc0d49f0c08771e267e8'
          test "$(docker image inspect "$WEB_IMAGE" --format '{{.Architecture}}')" = 'amd64'
          test "$(docker image inspect "$WEB_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = '86962b5018701f2fef3482fae7b3edda9039b9a8'
      - name: Log in to the existing package registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the accepted Web revision
        run: docker push "$WEB_IMAGE"
